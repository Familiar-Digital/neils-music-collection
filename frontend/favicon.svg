<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A record: black disc, grooves, pale label, spindle hole. Reads at 16px
       because the detail is concentric rather than fine. -->
  <circle cx="32" cy="32" r="31" fill="#0A0A0A"/>
  <g fill="none" stroke="#FFFFFF" stroke-opacity=".22">
    <circle cx="32" cy="32" r="26" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="21" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="16" stroke-width="1.5"/>
  </g>
  <circle cx="32" cy="32" r="10.5" fill="#F2F2F2"/>
  <circle cx="32" cy="32" r="2.6" fill="#0A0A0A"/>
</svg>
